name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  stable:
    name: Stable verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev pkg-config python3-yaml

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check generated repository guidance
        run: python3 .ai/generators/compile.py --check

      - name: Run the complete test suite
        run: cargo +stable test --locked --all-features

      - name: Check all examples
        run: cargo +stable check --locked --all-features --examples

      - name: Check supported feature combinations
        run: |
          cargo +stable check --locked --no-default-features --features rustls-tls
          cargo +stable check --locked --no-default-features --features native-tls
          cargo +stable check --locked --no-default-features --features rustls-tls,streaming
          cargo +stable check --locked --no-default-features --features native-tls,streaming

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --all-features --no-deps

      - name: Verify the crate archive
        run: cargo +stable package --locked

  msrv:
    name: MSRV 1.85 published library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev pkg-config

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Compile the published library at the declared MSRV
        run: cargo +1.85.0 check --locked --lib --all-features
