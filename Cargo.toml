[package]
name = "breeze-icici"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = true
description = "Async, typed Rust SDK for the ICICI Direct Breeze API"
repository = "https://github.com/SPRAGE/breeze-icici-rs"
documentation = "https://docs.rs/breeze-icici"
readme = "README.md"
license = "Apache-2.0"
keywords = ["icici", "breeze", "trading", "brokerage", "finance"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
]
autobins = false
autoexamples = false
autobenches = false
autotests = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
streaming = ["dep:futures-util", "dep:rust_socketio"]
tracing = ["dep:tracing"]
test-util = []
sdk-contract = ["test-util"]

[[example]]
name = "authenticate"
path = "examples/authenticate.rs"

[[example]]
name = "historical_data"
path = "examples/historical_data.rs"

[[example]]
name = "market_data"
path = "examples/market_data.rs"

[[example]]
name = "account_portfolio"
path = "examples/account_portfolio.rs"

[[example]]
name = "orders_and_trades"
path = "examples/orders_and_trades.rs"

[[example]]
name = "risk_calculators"
path = "examples/risk_calculators.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["streaming"]

[[example]]
name = "mutation_requests"
path = "examples/mutation_requests.rs"

[[test]]
name = "fixture_corpus"
path = "tests/fixture_corpus.rs"

[[test]]
name = "sdk_contract"
path = "tests/sdk_contract.rs"
required-features = ["sdk-contract"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures-util = { version = "0.3", optional = true }
http = "1"
reqwest = { version = "0.12", default-features = false }
rust_socketio = { version = "0.6", features = ["async"], optional = true }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", optional = true }
url = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"
static_assertions = "1"
trybuild = "1"
wiremock = "0.6"
