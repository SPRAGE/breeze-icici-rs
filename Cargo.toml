[package]
name = "breeze-icici"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Async, typed Rust SDK for the ICICI Direct Breeze API"
repository = "https://github.com/SPRAGE/breeze-icici-rs"
autobins = false
autoexamples = false
autobenches = false
autotests = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
streaming = ["dep:futures-util", "dep:rust_socketio"]
tracing = ["dep:tracing"]
test-util = []
sdk-contract = ["test-util"]

[[test]]
name = "fixture_corpus"
path = "tests/fixture_corpus.rs"

[[test]]
name = "sdk_contract"
path = "tests/sdk_contract.rs"
required-features = ["sdk-contract"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures-util = { version = "0.3", optional = true }
http = "1"
reqwest = { version = "0.12", default-features = false }
rust_socketio = { version = "0.6", features = ["async"], optional = true }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", optional = true }
url = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"
static_assertions = "1"
trybuild = "1"
wiremock = "0.6"
